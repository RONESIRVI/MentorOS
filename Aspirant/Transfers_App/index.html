<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC अध्ययन पोर्टल</title>
    <meta name="description" content="UPSC अध्ययन सामग्री और महत्वपूर्ण जानकारी">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <div class="background-mesh"></div>

    <main class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1>UPSC अध्ययन पोर्टल</h1>
                <p>यहाँ आप UPSC से संबंधित महत्वपूर्ण अध्ययन सामग्री, नोट्स और करंट अफेयर्स को महीने-वार देख सकते हैं। यह डेटा सीधे Google Sheet से लाइव आ रहा है।</p>
            </div>
        </header>

        <section class="controls-section">
            <div class="search-container">
                <div class="custom-select">
                    <select id="year-select" aria-label="Select Year">
                        <option value="">वर्ष चुनें</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                    </select>
                    <i class="ph ph-caret-down"></i>
                </div>
                <button id="search-btn" class="btn btn-primary">
                    <i class="ph ph-magnifying-glass"></i> खोजें
                </button>
            </div>
        </section>

        <div class="dashboard-layout">
            <!-- Left Pane: Months List -->
            <aside class="panel list-panel">
                <div class="panel-header">
                    <h2>महीने-वार अध्ययन सामग्री</h2>
                </div>
                <div class="table-container">
                    <table class="data-table" id="months-table">
                        <thead>
                            <tr>
                                <th>महीना-वर्ष</th>
                                <th>टॉपिक्स की संख्या</th>
                                <th>देखें</th>
                            </tr>
                        </thead>
                        <tbody id="months-tbody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </aside>

            <!-- Right Pane: specific transfers -->
            <section class="panel details-panel">
                <div class="panel-header">
                    <h2 id="transfers-title">विषय सूची</h2>
                </div>
                <div class="table-container">
                    <table class="data-table" id="transfers-table">
                        <thead id="transfers-thead">
                            <!-- Headers Populated dynamically by JS -->
                        </thead>
                        <tbody id="transfers-tbody">
                            <!-- Populated by JS -->
                            <tr><td colspan="100%" class="empty-state">डेटा लोड हो रहा है... (Loading data)</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Details Modal -->
    <div id="transfer-modal" class="modal-overlay hidden" aria-hidden="true">
        <div class="modal-content glass-effect">
            <div class="modal-header">
                <h3 id="modal-title">विस्तृत जानकारी</h3>
                <button id="close-modal" class="icon-btn" aria-label="Close modal">
                    <i class="ph ph-x"></i>
                </button>
            </div>
            <div class="modal-body" id="modal-body-content">
                <!-- Dynamically populated by JS based on CSV columns -->
            </div>
            <div class="modal-footer">
                <button id="share-btn" class="icon-btn tooltip" aria-label="Share">
                    <i class="ph ph-share-network"></i>
                    <span class="tooltip-text">शेयर करें</span>
                </button>
                <button id="print-btn" class="icon-btn tooltip" aria-label="Print">
                    <i class="ph ph-printer"></i>
                    <span class="tooltip-text">प्रिंट करें</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script src="app.js"></script>
</body>
</html>
