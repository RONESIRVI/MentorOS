<div id="section-mentor-students" class="admin-section">
  <div class="dash-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
    <div class="welcome-text"><h1 style="font-size:1.6rem; font-weight:700; color:#f8fafc; margin:0 0 4px;">My Students 👥</h1><p style="color:#94a3b8; margin:0;">Monitor progress and assign tasks.</p></div>
    <button onclick="window.loadStudents()" style="background:#10b981; color:white; padding:10px 20px; border-radius:10px; border:none; cursor:pointer; font-weight:700;">Refresh List</button>
  </div>
  <div class="panel" style="background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 24px;">
    <table style="width:100%; border-collapse:collapse;">
      <thead>
        <tr style="border-bottom: 1px solid rgba(255,255,255,0.08);">
          <th style="padding:12px 16px; text-align:left; color:#cbd5e1;">Name</th>
          <th style="padding:12px 16px; text-align:left; color:#cbd5e1;">Email</th>
          <th style="padding:12px 16px; text-align:left; color:#cbd5e1;">Status</th>
          <th style="padding:12px 16px; text-align:right; color:#cbd5e1;">Action</th>
        </tr>
      </thead>
      <tbody id="students-table-body"></tbody>
    </table>
  </div>
</div>
