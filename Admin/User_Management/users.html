<div class="dash-header" style="margin-bottom: 24px;">
  <div class="welcome-text">
    <h1>User Management 👥</h1>
    <p>View all registered users and assign roles (Aspirant, Mentor, Admin)</p>
  </div>
  <button class="panel-action" onclick="loadUsersList()" style="background:var(--navy); color:white; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:600;">↻ Refresh List</button>
</div>

<div class="panel">
  <div class="table-container">
    <table style="width: 100%; border-collapse: collapse; min-width: 600px;">
      <thead>
        <tr style="text-align: left; border-bottom: 2px solid var(--border); color: var(--mute);">
          <th style="padding: 12px; font-weight:600;">Email ID</th>
          <th style="padding: 12px; font-weight:600;">Current Role</th>
          <th style="padding: 12px; font-weight:600; text-align:right;">Actions</th>
        </tr>
      </thead>
      <tbody id="admin-users-table-body">
        <tr>
          <td colspan="3" style="padding: 20px; text-align: center; color: var(--mute);">Loading users...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
